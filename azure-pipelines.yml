trigger:
  - main

variables:
  acrServiceConnection: 'sc-acr-devops'
  sshServiceConnection: 'sc-vm-docker'
  acrLoginServer: 'acrsem7g4js30142.azurecr.io'
  imageRepository: 'app-web-sem7'

stages:
# STAGE 1: CI (Compilación y subida a ACR)
- stage: Build
  displayName: 'Stage: Compilación y Push a ACR'
  jobs:
  - job: BuildAndPush
    displayName: 'Compilar imagen y publicar en ACR'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: 'Construir imagen Docker'
      inputs:
        command: 'build'
        repository: '$(imageRepository)'
        dockerfile: '**/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest

    - task: Docker@2
      displayName: 'Empujar imagen a Azure Container Registry'
      inputs:
        containerRegistry: '$(acrServiceConnection)'
        repository: '$(imageRepository)'
        command: 'push'
        tags: |
          $(Build.BuildId)
          latest

# STAGE 2: CD - Despliegue en Entorno QA (Puerto 8080)
- stage: DeployQA
  displayName: 'Stage: Despliegue en QA (Staging)'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployToQA
    displayName: 'Desplegar contenedor en puerto 8080'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: SSH@0
      displayName: 'Ejecutar despliegue QA en VM'
      inputs:
        sshEndpoint: '$(sshServiceConnection)'
        runOptions: 'inline'
        inline: |
          echo "=== 1. Deteniendo contenedor QA anterior ==="
          docker stop app-qa || true
          docker rm app-qa || true

          echo "=== 2. Descargando imagen desde ACR ==="
          docker pull \((acrLoginServer)/\)(imageRepository):latest

          echo "=== 3. Levantando contenedor QA en puerto 8080 ==="
          docker run -d --name app-qa -p 8080:80 \((acrLoginServer)/\)(imageRepository):latest

          echo "=== 4. Validando estado del contenedor QA ==="
          docker ps --filter "name=app-qa"

# STAGE 3: CD - Despliegue en Entorno Producción (Puerto 80)
- stage: DeployProd
  displayName: 'Stage: Despliegue en Producción'
  dependsOn: DeployQA
  condition: succeeded()
  jobs:
  - job: DeployToProd
    displayName: 'Desplegar contenedor en puerto 80'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: SSH@0
      displayName: 'Ejecutar despliegue Producción en VM'
      inputs:
        sshEndpoint: '$(sshServiceConnection)'
        runOptions: 'inline'
        inline: |
          echo "=== 1. Deteniendo contenedor Producción anterior ==="
          docker stop app-prod || true
          docker rm app-prod || true

          echo "=== 2. Levantando contenedor Producción en puerto 80 ==="
          docker run -d --name app-prod -p 80:80 \((acrLoginServer)/\)(imageRepository):latest

          echo "=== 3. Validando estado del contenedor Producción ==="
          docker ps --filter "name=app-prod"
