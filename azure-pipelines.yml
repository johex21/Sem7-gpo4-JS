trigger:
  - main

variables:
  acrServiceConnection: 'sc-acr-devops'
  sshServiceConnection: 'sc-vm-docker'
  acrServer: 'acrsem7g4js30142.azurecr.io'
  imageName: 'app-web-sem7'

stages:
# ---------------------------------------------------------
# STAGE 1: CI (Compilación y subida a ACR)
# ---------------------------------------------------------
- stage: Build
  displayName: 'Stage: Compilación y Push a ACR'
  jobs:
  - job: BuildAndPush
    displayName: 'Compilar imagen y publicar en ACR'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: 'Construir y empujar imagen a ACR'
      inputs:
        containerRegistry: '$(acrServiceConnection)'
        repository: '$(imageName)'
        command: 'buildAndPush'
        dockerfile: '**/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest

# ---------------------------------------------------------
# STAGE 2: CD - Despliegue en Entorno QA (Puerto 8080)
# ---------------------------------------------------------
- stage: DeployQA
  displayName: 'Stage: Despliegue en QA (Staging)'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployToQA
    displayName: 'Desplegar contenedor en puerto 8080'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: SSH@0
      displayName: 'Ejecutar despliegue QA en VM'
      inputs:
        sshEndpoint: '$(sshServiceConnection)'
        runOptions: 'inline'
        inline: |
          echo "=== 1. Autenticando Docker con ACR ==="
          docker login acrsem7g4js30142.azurecr.io -u acrsem7g4js30142 -p $(ACR_PASSWORD)

          echo "=== 2. Limpiando contenedor QA previo si existe ==="
          if [ \((docker ps -a -q -f name=^/app-qa\)) ]; then
              docker stop app-qa
              docker rm app-qa
          fi

          echo "=== 3. Descargando imagen desde ACR ==="
          docker pull acrsem7g4js30142.azurecr.io/app-web-sem7:latest

          echo "=== 4. Levantando contenedor QA en puerto 8080 ==="
          docker run -d --name app-qa -p 8080:80 acrsem7g4js30142.azurecr.io/app-web-sem7:latest

          echo "=== 5. Estado del contenedor QA ==="
          docker ps -f name=app-qa

# ---------------------------------------------------------
# STAGE 3: CD - Despliegue en Entorno Producción (Puerto 80)
# ---------------------------------------------------------
- stage: DeployProd
  displayName: 'Stage: Despliegue en Producción'
  dependsOn: DeployQA
  condition: succeeded()
  jobs:
  - job: DeployToProd
    displayName: 'Desplegar contenedor en puerto 80'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: SSH@0
      displayName: 'Ejecutar despliegue Producción en VM'
      inputs:
        sshEndpoint: '$(sshServiceConnection)'
        runOptions: 'inline'
        inline: |
          echo "=== 1. Limpiando contenedor Producción previo si existe ==="
          if [ \((docker ps -a -q -f name=^/app-prod\)) ]; then
              docker stop app-prod
              docker rm app-prod
          fi

          echo "=== 2. Levantando contenedor Producción en puerto 80 ==="
          docker run -d --name app-prod -p 80:80 acrsem7g4js30142.azurecr.io/app-web-sem7:latest

          echo "=== 3. Estado del contenedor Producción ==="
          docker ps -f name=app-prod
